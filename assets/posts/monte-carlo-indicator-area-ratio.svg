<svg xmlns="http://www.w3.org/2000/svg" width="820" height="595" viewBox="0 0 820 595" role="img" aria-labelledby="title desc">
  <title id="title">Indicator variables turn the shaded area into a probability</title>
  <desc id="desc">The area under f is shaded teal. A teal circle below the curve is labeled I j equals one, while an amber cross above it is labeled I j equals zero. For a point sampled uniformly from rectangle A, the probability of I j equals one is the shaded area divided by the whole rectangle area.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #24343b; }
    .math { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
    .muted { fill: #52656d; }
  </style>
  <rect width="820" height="595" fill="#fcfdfc"/>
  <text x="410" y="40" text-anchor="middle" font-size="25">Every equal-area region is equally likely.</text>
